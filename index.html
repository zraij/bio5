:root{--bg:#0E1020;--p:#171A30;--p2:#20243F;--ln:#2E3358;--ink:#ECEBFA;--mu:#9A9CC0;--c1:#A58DFF;--c2:#33C6C6;--c3:#F0A93E;--c4:#FF7389;--c6:#3FCB8A}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}html{background:#0E1020}
body{background:radial-gradient(circle at 20% 10%,#A58DFF22,transparent 40%),radial-gradient(circle at 80% 90%,#33C6C622,transparent 40%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:Cairo,"Segoe UI",Tahoma,sans-serif;padding:16px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:22px;padding:28px 24px;box-shadow:0 20px 60px #0008}

h1{margin:0;text-align:center;font-size:25px}p.s{margin:6px 0 20px;text-align:center;color:var(--mu);font-size:14px}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 6px}
input[type=text],input[type=password]{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--p2);color:var(--ink);font:inherit;font-size:16px;outline:none}
input.ltr{direction:ltr;text-align:left}
input:focus{border-color:var(--c1);box-shadow:0 0 0 3px #A58DFF33}
.rem{display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-size:14px;color:var(--mu)}.rem input{width:18px;height:18px;accent-color:var(--c1)}
button{padding:11px 16px;border:0;border-radius:12px;background:var(--c1);color:#0E1020;font:inherit;font-size:16px;cursor:pointer}

button:disabled{opacity:.55;cursor:wait}
.err{min-height:22px;margin-top:12px;text-align:center;color:var(--c4);font-size:14px}.ok{color:var(--c6)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pwbox{position:relative}.pwbox input{padding-right:50px!important}.pwbox .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px!important;height:40px;margin:0!important;padding:0!important;border:0!important;border-radius:10px;background:transparent!important;box-shadow:none!important;color:inherit;opacity:.6;cursor:pointer;display:grid;place-items:center}.pwbox .eye:hover,.pwbox .eye.on{opacity:1}.pwbox .eye svg{width:22px;height:22px}.pwbox .eye .sl{display:none}.pwbox .eye.on .sl{display:inline}</style>
<script>
const AU = (() => {
  const enc = new TextEncoder(), dec = new TextDecoder();
  const ub = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const bu = (b) => { const a = new Uint8Array(b); let s = ''; for (let i = 0; i < a.length; i += 8192) s += String.fromCharCode(...a.subarray(i, i + 8192)); return btoa(s); };
  const rnd = (n) => crypto.getRandomValues(new Uint8Array(n));
  const hex = (b) => [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, '0')).join('');
  const norm = (u) => String(u || '').trim().toLowerCase();
  async function uidOf(U, u) { return hex(await crypto.subtle.digest('SHA-256', new Uint8Array([...ub(U.ss), ...enc.encode(u)]))).slice(0, 24); }
  async function wkey(u, p, salt, it, use) {
    const base = await crypto.subtle.importKey('raw', enc.encode(u + ':' + p), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, [use]);
  }
  const kimp = (raw, use) => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, use);
  async function unwrap(U, user, pw) {
    const u = norm(user), id = await uidOf(U, u), e = U.u.find((x) => x.i === id);
    if (!e) return null;
    try { const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(e.v), additionalData: enc.encode(id) }, await wkey(u, pw, ub(e.s), U.it, 'decrypt'), ub(e.k)); return { raw: new Uint8Array(raw), entry: e }; } catch (_) { return null; }
  }
  async function meta(K, e) {
    const [iv, ct] = e.m.split('.');
    return JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ub(iv) }, await kimp(K, ['decrypt']), ub(ct))));
  }
  async function makeEntry(U, K, user, pw, name, admin) {
    const u = norm(user), id = await uidOf(U, u), salt = rnd(16), wiv = rnd(12), miv = rnd(12);
    const k = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: wiv, additionalData: enc.encode(id) }, await wkey(u, pw, salt, U.it, 'encrypt'), K);
    const m = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: miv }, await kimp(K, ['encrypt']), enc.encode(JSON.stringify({ u, n: name, t: new Date().toISOString().slice(0, 10) })));
    return { i: id, a: admin ? 1 : 0, s: bu(salt), v: bu(wiv), k: bu(k), m: bu(miv) + '.' + bu(m) };
  }
  async function fetchUsers(fallback) {
    try { const r = await fetch('users.json?t=' + Date.now(), { cache: 'no-store' }); if (r.ok) return await r.json(); } catch (_) {}
    return fallback;
  }
  return { ub, bu, rnd, norm, uidOf, unwrap, meta, makeEntry, fetchUsers, kimp };
})();
</script>
